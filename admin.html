<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="favicon_transparent.ico">
  <title>Redskies - Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loader">
  <img src="logo.png" alt="Redskies" class="loader-logo">
</div>

<!-- PASSWORD SCREEN -->
<div id="password-screen">
  <div class="admin-login">
    <img src="logo.png" alt="Redskies" style="height:80px; margin-bottom:20px;">
    <h2>Admin Login</h2>
    <input type="password" id="password-input" placeholder="Enter password">
    <button class="btn" onclick="checkPassword()">Login</button>
    <p id="login-error" style="color:#ff2e63; display:none; margin-top:10px;">Incorrect password</p>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="admin-panel" style="display:none;">

  <header>
    <img src="logo.png" alt="Redskies" class="logo">
    <nav>
      <a href="index.html">Home</a>
      <a href="gigs.html">Gigs</a>
      <a href="gallery.html">Gallery</a>
      <a href="merch.html">Merch</a>
    </nav>
  </header>

  <section class="admin-section">
    <h2>Manage Gigs</h2>

    <div class="admin-form">
      <h3>Add New Gig</h3>
      <input type="text" id="venue" placeholder="Venue (e.g. Marrs Bar)">
      <input type="text" id="location" placeholder="Location (e.g. Worcester)">
      <input type="date" id="date">
      <input type="text" id="time" placeholder="Time (e.g. 9pm) — optional">
      <input type="text" id="support" placeholder="Support act — optional">
      <input type="text" id="ticket_url" placeholder="Ticket URL — optional">
      <input type="text" id="ticket_label" placeholder="Ticket button label (e.g. Buy Tickets, Free Entry)">
      <button class="btn" onclick="addGig()">Add Gig</button>
      <p id="add-success" style="color:#fff; display:none; margin-top:10px;">Gig added successfully!</p>
      <p id="add-error" style="color:#ff2e63; display:none; margin-top:10px;">Something went wrong, please try again.</p>
    </div>

    <div class="admin-gigs">
      <h3>Current Gigs</h3>
      <div id="gigs-list"></div>
    </div>

  </section>

  <footer>
    <p>© 2026 Redskies</p>
  </footer>

</div>

<script>
  const SUPABASE_URL = "https://ydpsowunyeyjtxsngsrn.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlkcHNvd3VueWV5anR4c25nc3JuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDAzMjQsImV4cCI6MjA5NjU3NjMyNH0.vhWukCBhcBtRugBl3Pr6PeFjTg7zszRZ971oniANzb8";

  window.addEventListener("load", function () {
    setTimeout(function () {
      document.getElementById("loader").classList.add("hide");
    }, 1800);
  });

  function checkPassword() {
    const input = document.getElementById("password-input").value;
    if (input === "B@dB@nd1") {
      document.getElementById("password-screen").style.display = "none";
      document.getElementById("admin-panel").style.display = "block";
      loadGigs();
    } else {
      document.getElementById("login-error").style.display = "block";
    }
  }

  document.getElementById("password-input").addEventListener("keypress", function(e) {
    if (e.key === "Enter") checkPassword();
  });

  async function loadGigs() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/gigs?order=date.asc`, {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      }
    });
    const gigs = await res.json();
    const list = document.getElementById("gigs-list");
    list.innerHTML = "";

    if (gigs.length === 0) {
      list.innerHTML = "<p style='color:#666;'>No gigs added yet.</p>";
      return;
    }

    gigs.forEach(function(gig) {
      const div = document.createElement("div");
      div.className = "card";
      div.style.display = "flex";
      div.style.justifyContent = "space-between";
      div.style.alignItems = "center";
      div.innerHTML = `
        <div>
          <p style="margin:0"><strong>${gig.venue} — ${gig.location}</strong></p>
          <p style="margin:4px 0">${formatDate(gig.date)}${gig.time ? " — " + gig.time : ""}</p>
          ${gig.support ? `<p style="margin:0;color:#888;font-style:italic">Support: ${gig.support}</p>` : ""}
        </div>
        <button class="btn" onclick="deleteGig(${gig.id})" style="border-color:#ff2e63;color:#ff2e63;background:transparent;cursor:pointer;">Remove</button>
      `;
      list.appendChild(div);
    });
  }

  async function addGig() {
    const venue = document.getElementById("venue").value.trim();
    const location = document.getElementById("location").value.trim();
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value.trim();
    const support = document.getElementById("support").value.trim();
    const ticket_url = document.getElementById("ticket_url").value.trim();
    const ticket_label = document.getElementById("ticket_label").value.trim();

    if (!venue || !location || !date || !ticket_label) {
      alert("Please fill in venue, location, date and ticket label at minimum.");
      return;
    }

    const res = await fetch(`${SUPABASE_URL}/rest/v1/gigs`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify({ venue, location, date, time, support, ticket_url, ticket_label })
    });

    if (res.ok) {
      document.getElementById("add-success").style.display = "block";
      document.getElementById("add-error").style.display = "none";
      document.getElementById("venue").value = "";
      document.getElementById("location").value = "";
      document.getElementById("date").value = "";
      document.getElementById("time").value = "";
      document.getElementById("support").value = "";
      document.getElementById("ticket_url").value = "";
      document.getElementById("ticket_label").value = "";
      setTimeout(() => document.getElementById("add-success").style.display = "none", 3000);
      loadGigs();
    } else {
      document.getElementById("add-error").style.display = "block";
    }
  }

  async function deleteGig(id) {
    if (!confirm("Are you sure you want to remove this gig?")) return;
    await fetch(`${SUPABASE_URL}/rest/v1/gigs?id=eq.${id}`, {
      method: "DELETE",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      }
    });
    loadGigs();
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
  }
</script>

</body>
</html>
